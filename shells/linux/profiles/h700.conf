# Dena.emu device profile. Spec: docs/specs/platform-modules.md
# Unverified: written from the public spec sheet and standard Linux
# input codes; confirm with tools/rig keytest on the device.
id = h700
name = Allwinner H700 (Anbernic RG35XX / RG40XX family)
match = rg35xx
match = rg40xx
match = rgcubexx
match = rg34xx
match = sun50i-h700
display = auto
backlight = /sys/class/backlight/*/brightness
backlight_max = 255
backlight_min = 8
battery = /sys/class/power_supply/*battery*
audio = default
# The SoC's analog codec, not the HDMI card (its number can come first).
audio_driver = sun4i-codec
# Speaker and headphones share LINEOUT through a mux; the kernel switches the
# speaker amplifier off while headphones are in (patch 0164), so the Speaker
# switch is left to it. Nothing is routed after reset, so the launcher sets
# the path at start. Line out 29 of 31 (-3 dB) leaves the speaker amplifier
# headroom at full volume; the volume keys move the digital DAC volume.
volume = DAC
mixer = DAC Playback Switch = on
mixer = DAC Reversed Playback Switch = off
mixer = Line Out Source Playback Route = Stereo
mixer = Line Out Playback Volume = 29
mixer = Line Out Playback Switch = on
verified = no
# Standard Linux gamepad codes (linux/input-event-codes.h, kernel
# Documentation/input/gamepad.rst). Nintendo-style labels: the bottom face
# button is B, the right one is A.
key.304 = b
key.305 = a
key.307 = x
key.308 = y
key.310 = l
key.311 = r
key.312 = l2
key.313 = r2
key.314 = select
key.315 = start
key.316 = menu
key.317 = l3
key.318 = r3
key.544 = up
key.545 = down
key.546 = left
key.547 = right
abs.16- = left
abs.16+ = right
abs.17- = up
abs.17+ = down
key.116 = power
key.115 = volume_up
key.114 = volume_down
